<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Audio storie sociali</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#111827; color:white; font-family:Arial,sans-serif; user-select:none; touch-action:manipulation; }
    #app { position:fixed; inset:0; display:flex; justify-content:center; align-items:center; text-align:center; padding:28px; box-sizing:border-box; }
    .testo { max-width:760px; font-size:clamp(24px,5vw,46px); line-height:1.25; font-weight:bold; }
    .sotto { display:block; margin-top:22px; font-size:clamp(16px,3vw,24px); font-weight:normal; opacity:.85; }
    .angolo { position:fixed; width:50vw; height:50vh; display:none; align-items:center; justify-content:center; text-align:center; padding:18px; box-sizing:border-box; border:2px dashed rgba(255,255,255,.25); background:rgba(255,255,255,.04); font-size:clamp(20px,4vw,34px); font-weight:bold; }
    body.menu .angolo { display:flex; }
    #altoSinistra { top:0; left:0; } #altoDestra { top:0; right:0; } #bassoSinistra { bottom:0; left:0; } #bassoDestra { bottom:0; right:0; }
    #avvio { position:fixed; inset:0; z-index:10; background:#111827; display:flex; align-items:center; justify-content:center; text-align:center; padding:30px; box-sizing:border-box; }
    #avvio.nascosto { display:none; }
    #stato { position:fixed; left:8px; right:8px; bottom:8px; text-align:center; font-size:13px; opacity:.65; pointer-events:none; }
    .lampeggia { animation:pulse .65s infinite alternate; }
    @keyframes pulse { from { opacity:.55; transform:scale(.99); } to { opacity:1; transform:scale(1.02); } }
  </style>
</head>
<body>
  <div id="avvio"><div class="testo">Tocca per iniziare<span class="sotto">Al primo tocco partirà l'audio introduttivo.</span></div></div>
  <div id="app"><div class="testo" id="testo">Audio storie sociali<span class="sotto">Un clic: pausa/riprendi. Doppio clic: torna indietro. Tre clic: vai verso la fine dell’audio.</span></div></div>
  <div class="angolo" id="altoSinistra"></div><div class="angolo" id="altoDestra"></div><div class="angolo" id="bassoSinistra"></div><div class="angolo" id="bassoDestra"></div>
  <div id="stato"></div>
  <audio id="player" preload="auto" playsinline></audio>

<script>
const AUDIO = {
  introduzione: "introduzione.mp3",
  istruzioni: "istruzioni.mp3",
  menuPrincipaleAudio: "storie panetteria,pizzeria,bar.mp3",
  menuTrenoPizzeria: "treno e pizzeria_menu.mp3",
  menuCastelloMedico: "castello e medico_menu.mp3",
  introStoria: "intro_storiasociale.mp3",
  chiusura: "chiusurastoriasociale.mp3",
  cinema: "VIDEO CINEMA.mp3",
  panetteria: "AUDIO PANETTERIA.mp3",
  pizzeria: "AUDIO PIZZERIA.mp3",
  bar: "AUDIO STORIA BAR.mp3",
  castello: "AUDIO STORIA DEL CASTELLO.mp3",
  medico: "AUDIO STORIA MEDICO.mp3",
  treno: "AUDIO TRENO.mp3"
};

const player = document.getElementById("player");
const testo = document.getElementById("testo");
const avvio = document.getElementById("avvio");
const stato = document.getElementById("stato");
const altoSinistra = document.getElementById("altoSinistra");
const altoDestra = document.getElementById("altoDestra");
const bassoSinistra = document.getElementById("bassoSinistra");
const bassoDestra = document.getElementById("bassoDestra");

let modalita = "attesa";
let playlist = [];
let indice = 0;
let menuCorrente = "principale";
let menuPrecedente = "principale";
let ultimaStoria = null;
let timerClick = null;
let conteggioClick = 0;
let finestraIstruzioniAttiva = false;
let timerFinestraIstruzioni = null;

function scrivi(titolo, sottotitolo = "") { testo.innerHTML = titolo + (sottotitolo ? `<span class="sotto">${sottotitolo}</span>` : ""); }
function aggiornaStato(messaggio) { stato.textContent = messaggio || ""; }
function nascondiAvvio() { avvio.classList.add("nascosto"); }
function mostraAvvio() { avvio.classList.remove("nascosto"); }
function nascondiMenu() { document.body.classList.remove("menu"); altoSinistra.textContent=""; altoDestra.textContent=""; bassoSinistra.textContent=""; bassoDestra.textContent=""; }
function entraInFullscreen() { try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); } catch(e) {} }

function playFile(file, titolo = "Riproduzione audio", opzioni = {}) {
  nascondiMenu(); nascondiAvvio();
  modalita = opzioni.modalita || "audioSingolo";
  player.pause(); player.src = file; player.currentTime = 0; player.load();
  scrivi(titolo, opzioni.sottotitolo || "Un clic: pausa/riprendi. Doppio clic: torna indietro. Tre clic: vai verso la fine dell’audio.");
  const promessa = player.play();
  if (promessa !== undefined) promessa.then(()=>aggiornaStato("Audio in riproduzione")).catch(()=>{ mostraAvvio(); aggiornaStato("Avvio bloccato: tocca lo schermo."); });
}

function avviaPlaylist(lista, opzioni = {}) {
  nascondiMenu(); nascondiAvvio();
  modalita = "riproduzione"; playlist = lista; indice = 0;
  menuPrecedente = opzioni.menuPrecedente || menuCorrente || "principale";
  if (opzioni.memorizzaStoria) ultimaStoria = lista;
  scrivi(opzioni.titolo || "Riproduzione audio", "Un clic: pausa/riprendi. Doppio clic: torna al menù precedente. Tre clic: vai verso la fine dell’audio.");
  riproduciAudioCorrente();
}

function riproduciAudioCorrente() {
  if (!playlist.length) return;
  player.pause(); player.src = playlist[indice]; player.currentTime = 0; player.load();
  const promessa = player.play();
  if (promessa !== undefined) promessa.then(()=>{ nascondiAvvio(); aggiornaStato("Audio " + (indice + 1) + " di " + playlist.length); }).catch(()=>{ mostraAvvio(); aggiornaStato("Avvio bloccato: tocca lo schermo."); });
}

function apriFinestraIstruzioni() {
  finestraIstruzioniAttiva = true; modalita = "finestraIstruzioni";
  scrivi("Vuoi ascoltare le istruzioni?", "Fai doppio tap entro 3 secondi. Altrimenti partirà il menù delle storie.");
  testo.classList.add("lampeggia"); aggiornaStato("Finestra istruzioni attiva");
  clearTimeout(timerFinestraIstruzioni);
  timerFinestraIstruzioni = setTimeout(()=>{
    if (!finestraIstruzioniAttiva) return;
    finestraIstruzioniAttiva = false; testo.classList.remove("lampeggia");
    playFile(AUDIO.menuPrincipaleAudio, "Menù cinema, panetteria, pizzeria e bar", { modalita:"audioMenuPrincipale", sottotitolo:"Al termine potrai scegliere usando i quattro angoli dello schermo." });
  }, 3000);
}

function avviaIstruzioni() {
  clearTimeout(timerFinestraIstruzioni); finestraIstruzioniAttiva = false; testo.classList.remove("lampeggia");
  playFile(AUDIO.istruzioni, "Istruzioni del sito", { modalita:"istruzioni", sottotitolo:"Al termine partirà automaticamente il menù delle storie sociali." });
}

function mostraMenu(nomeMenu) {
  modalita = "menu"; menuCorrente = nomeMenu; nascondiAvvio(); document.body.classList.add("menu"); testo.classList.remove("lampeggia");
  if (nomeMenu === "principale") {
    scrivi("Scegli una storia sociale", "Usa i quattro angoli dello schermo.");
    altoSinistra.textContent = "Cinema"; altoDestra.textContent = "Panetteria"; bassoDestra.textContent = "Bar"; bassoSinistra.textContent = "Altre storie";
  }
  if (nomeMenu === "altre1") {
    scrivi("Altre storie sociali", "Usa i quattro angoli dello schermo.");
    altoSinistra.textContent = "Pizzeria"; altoDestra.textContent = "Treno"; bassoDestra.textContent = "Torna al menù principale"; bassoSinistra.textContent = "Castello e medico";
  }
  if (nomeMenu === "altre2") {
    scrivi("Altre storie sociali", "Usa i quattro angoli dello schermo.");
    altoSinistra.textContent = "Castello"; altoDestra.textContent = "Medico"; bassoDestra.textContent = "Torna al menù precedente"; bassoSinistra.textContent = "Torna al menù principale";
  }
  if (nomeMenu === "fineStoria") {
    scrivi("La storia sociale è terminata", "Scegli cosa fare. Doppio clic: termina l’esperienza.");
    altoSinistra.textContent = "Menù principale"; altoDestra.textContent = "Altre storie"; bassoDestra.textContent = "Torna al menù precedente"; bassoSinistra.textContent = "Riascolta questa storia";
  }
  aggiornaStato("Menù attivo: " + nomeMenu);
}

player.addEventListener("ended", () => {
  if (modalita === "introduzione") { apriFinestraIstruzioni(); return; }
  if (modalita === "istruzioni") { playFile(AUDIO.menuPrincipaleAudio, "Menù cinema, panetteria, pizzeria e bar", { modalita:"audioMenuPrincipale", sottotitolo:"Al termine potrai scegliere usando i quattro angoli dello schermo." }); return; }
  if (modalita === "audioMenuPrincipale") { mostraMenu("principale"); return; }
  if (modalita === "audioMenuAltre1") { mostraMenu("altre1"); return; }
  if (modalita === "audioMenuAltre2") { mostraMenu("altre2"); return; }
  if (modalita === "riproduzione") {
    indice++;
    if (indice < playlist.length) { riproduciAudioCorrente(); return; }
    mostraMenu("fineStoria");
  }
});

player.addEventListener("error", () => {
  mostraAvvio();
  scrivi("Audio non trovato", "Controlla che il nome del file nel codice sia identico al nome del file nella cartella.");
  aggiornaStato("File non caricato: " + player.src);
});

function pausaRiprendi() {
  if (!["riproduzione", "introduzione", "istruzioni", "audioMenuPrincipale", "audioMenuAltre1", "audioMenuAltre2", "audioSingolo"].includes(modalita)) return;
  if (player.paused) player.play().catch(()=>mostraAvvio());
  else { player.pause(); aggiornaStato("Audio in pausa"); }
}
function tornaIndietro() {
  if (modalita === "finestraIstruzioni") { avviaIstruzioni(); return; }
  if (modalita === "riproduzione") { player.pause(); mostraMenu(menuPrecedente || "principale"); return; }
  if (modalita === "menu" && menuCorrente === "fineStoria") { terminaEsperienza(); return; }
}
function vaiVersoFineAudio() {
  if (!player.src || isNaN(player.duration) || !isFinite(player.duration)) return;
  player.currentTime = Math.max(0, player.duration - 0.4);
  aggiornaStato("Vai verso la fine dell'audio");
}
function terminaEsperienza() { player.pause(); nascondiMenu(); nascondiAvvio(); modalita = "terminata"; scrivi("Esperienza terminata", "Puoi chiudere questa pagina."); aggiornaStato(""); }
function gestisciSequenzaClick(numeroClick) { if (numeroClick === 1) pausaRiprendi(); else if (numeroClick === 2) tornaIndietro(); else if (numeroClick >= 3) vaiVersoFineAudio(); }

document.body.addEventListener("click", (evento) => {
  if (evento.target.classList.contains("angolo")) return;
  if (evento.target.closest("#avvio")) return;
  conteggioClick++;
  clearTimeout(timerClick);
  timerClick = setTimeout(()=>{ gestisciSequenzaClick(conteggioClick); conteggioClick = 0; }, 320);
});

avvio.addEventListener("click", (evento) => {
  evento.stopPropagation(); entraInFullscreen();
  if (modalita === "attesa") playFile(AUDIO.introduzione, "Introduzione", { modalita:"introduzione", sottotitolo:"Al termine potrai fare doppio tap per ascoltare le istruzioni." });
  else player.play().then(nascondiAvvio).catch(()=>mostraAvvio());
});

altoSinistra.addEventListener("click", (evento) => {
  evento.stopPropagation();
  if (menuCorrente === "principale") { avviaPlaylist([AUDIO.introStoria, AUDIO.cinema, AUDIO.chiusura], { titolo:"Storia sociale del cinema", menuPrecedente:"principale", memorizzaStoria:true }); return; }
  if (menuCorrente === "altre1") { avviaPlaylist([AUDIO.introStoria, AUDIO.pizzeria, AUDIO.chiusura], { titolo:"Storia sociale della pizzeria", menuPrecedente:"altre1", memorizzaStoria:true }); return; }
  if (menuCorrente === "altre2") { avviaPlaylist([AUDIO.introStoria, AUDIO.castello, AUDIO.chiusura], { titolo:"Storia sociale del castello", menuPrecedente:"altre2", memorizzaStoria:true }); return; }
  if (menuCorrente === "fineStoria") playFile(AUDIO.menuPrincipaleAudio, "Menù cinema, panetteria, pizzeria e bar", { modalita:"audioMenuPrincipale", sottotitolo:"Al termine potrai scegliere usando i quattro angoli dello schermo." });
});

altoDestra.addEventListener("click", (evento) => {
  evento.stopPropagation();
  if (menuCorrente === "principale") { avviaPlaylist([AUDIO.introStoria, AUDIO.panetteria, AUDIO.chiusura], { titolo:"Storia sociale della panetteria", menuPrecedente:"principale", memorizzaStoria:true }); return; }
  if (menuCorrente === "altre1") { avviaPlaylist([AUDIO.introStoria, AUDIO.treno, AUDIO.chiusura], { titolo:"Storia sociale del treno", menuPrecedente:"altre1", memorizzaStoria:true }); return; }
  if (menuCorrente === "altre2") { avviaPlaylist([AUDIO.introStoria, AUDIO.medico, AUDIO.chiusura], { titolo:"Storia sociale del medico", menuPrecedente:"altre2", memorizzaStoria:true }); return; }
  if (menuCorrente === "fineStoria") playFile(AUDIO.menuTrenoPizzeria, "Menù pizzeria e treno", { modalita:"audioMenuAltre1", sottotitolo:"Al termine potrai scegliere usando i quattro angoli dello schermo." });
});

bassoDestra.addEventListener("click", (evento) => {
  evento.stopPropagation();
  if (menuCorrente === "principale") { avviaPlaylist([AUDIO.introStoria, AUDIO.bar, AUDIO.chiusura], { titolo:"Storia sociale del bar", menuPrecedente:"principale", memorizzaStoria:true }); return; }
  if (menuCorrente === "altre1") { playFile(AUDIO.menuPrincipaleAudio, "Menù cinema, panetteria, pizzeria e bar", { modalita:"audioMenuPrincipale", sottotitolo:"Al termine potrai scegliere usando i quattro angoli dello schermo." }); return; }
  if (menuCorrente === "altre2") { playFile(AUDIO.menuTrenoPizzeria, "Menù pizzeria e treno", { modalita:"audioMenuAltre1", sottotitolo:"Al termine potrai scegliere usando i quattro angoli dello schermo." }); return; }
  if (menuCorrente === "fineStoria") mostraMenu(menuPrecedente || "principale");
});

bassoSinistra.addEventListener("click", (evento) => {
  evento.stopPropagation();
  if (menuCorrente === "principale") { playFile(AUDIO.menuTrenoPizzeria, "Menù pizzeria e treno", { modalita:"audioMenuAltre1", sottotitolo:"Al termine potrai scegliere usando i quattro angoli dello schermo." }); return; }
  if (menuCorrente === "altre1") { playFile(AUDIO.menuCastelloMedico, "Menù castello e medico", { modalita:"audioMenuAltre2", sottotitolo:"Al termine potrai scegliere usando i quattro angoli dello schermo." }); return; }
  if (menuCorrente === "altre2") { playFile(AUDIO.menuPrincipaleAudio, "Menù cinema, panetteria, pizzeria e bar", { modalita:"audioMenuPrincipale", sottotitolo:"Al termine potrai scegliere usando i quattro angoli dello schermo." }); return; }
  if (menuCorrente === "fineStoria" && ultimaStoria) avviaPlaylist(ultimaStoria, { titolo:"Riascolto della storia sociale", menuPrecedente: menuPrecedente || "principale", memorizzaStoria:true });
});
</script>
</body>
</html>
